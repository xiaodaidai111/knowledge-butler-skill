<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>接口联调 · 简易测试</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #67708a;
      --accent: #2d6cdf;
      --border: #e3e7f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 45%, #eef2fb 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 20px 40px;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 8px;
    }
    p {
      margin: 0;
      color: var(--muted);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(20, 32, 70, 0.08);
      margin-top: 16px;
    }
    .row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
      flex: 1;
      min-width: 220px;
    }
    input[type="text"],
    input[type="password"] {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    input[type="file"] {
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fbfcff;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .chat-log {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 320px;
      overflow-y: auto;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fbfcff;
    }
    .bubble {
      padding: 10px 12px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .bubble.user {
      align-self: flex-end;
      background: #e8f0ff;
      color: #1c3f8f;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid var(--border);
    }
    .hint {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>接口联调 · 简易测试</h1>
      <p>用于快速验证对话与识图接口，适合本地或前端联调。</p>
    </header>

    <section class="card">
      <div class="row">
        <label>
          API Key（可选）
          <input type="password" id="api-key" placeholder="可留空，使用后端 .env 配置" />
        </label>
        <label>
          Base URL（可选）
          <input type="text" id="api-base-url" placeholder="如 https://api.chatanywhere.tech" />
        </label>
      </div>
    </section>

    <section class="card">
      <form id="chat-form">
        <div class="row">
          <label style="flex: 2;">
            输入文本
            <input type="text" id="chat-text" placeholder="例如：评估一下朝露烘焙工坊" />
          </label>
          <label>
            上传图片（可选）
            <input type="file" id="chat-image" accept="image/*" />
          </label>
        </div>
        <div class="row" style="margin-top: 12px;">
          <button class="btn-primary" type="submit">发送</button>
          <button class="btn-ghost" type="button" id="clear-btn">清空对话</button>
        </div>
      </form>
      <div class="chat-log" id="chat-log" style="margin-top: 16px;"></div>
      <div class="hint">支持纯文字、纯图片或文字+图片一起发送。</div>
    </section>
  </div>

  <script>
    const chatForm = document.getElementById('chat-form');
    const chatText = document.getElementById('chat-text');
    const chatImage = document.getElementById('chat-image');
    const chatLog = document.getElementById('chat-log');
    const apiKeyInput = document.getElementById('api-key');
    const apiBaseUrlInput = document.getElementById('api-base-url');
    const clearBtn = document.getElementById('clear-btn');
    const history = [];

    const getHeaders = () => {
      const headers = {};
      const apiKey = apiKeyInput.value.trim();
      const baseUrl = apiBaseUrlInput.value.trim();
      if (apiKey) headers['X-Api-Key'] = apiKey;
      if (baseUrl) headers['X-Base-Url'] = baseUrl;
      return headers;
    };

    const parseApiResponse = (res) => {
      if (res.code === 0 && res.data != null) return res.data;
      if (res.data != null) return res.data;
      return res;
    };

    const appendBubble = (role, text) => {
      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      chatLog.appendChild(bubble);
      chatLog.scrollTop = chatLog.scrollHeight;
    };

    chatForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = chatText.value.trim();
      const imageFile = chatImage.files && chatImage.files[0];
      if (!text && !imageFile) return;

      if (text) {
        history.push({ role: 'user', content: text });
        appendBubble('user', text);
      } else if (imageFile) {
        history.push({ role: 'user', content: '[图片]' });
        appendBubble('user', '[图片已发送]');
      }

      let response;
      if (imageFile) {
        const formData = new FormData();
        formData.append('message', text || '');
        formData.append('history', JSON.stringify(history.slice(0, -1)));
        formData.append('image', imageFile);
        response = await fetch('/api/chat', {
          method: 'POST',
          headers: getHeaders(),
          body: formData,
        });
      } else {
        const body = { message: text, history };
        response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...getHeaders() },
          body: JSON.stringify(body),
        });
      }

      const res = await response.json();
      const data = parseApiResponse(res);
      const reply = data.reply || res.message || '请求失败，请稍后重试。';
      history.push({ role: 'assistant', content: reply });
      appendBubble('assistant', reply);

      chatText.value = '';
      chatImage.value = '';
    });

    clearBtn.addEventListener('click', () => {
      history.length = 0;
      chatLog.innerHTML = '';
    });
  </script>
</body>
</html>
